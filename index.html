<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spotlight Rocket</title>
  
  <!-- SDKs -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { background-color: #070a12; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; }
    .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
    .glow-cyan { box-shadow: 0 0 20px rgba(6, 182, 212, 0.35); }
    .glow-green { box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }
    .glow-red { box-shadow: 0 0 20px rgba(244, 63, 94, 0.4); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between p-3 gap-2">

  <!-- Верхняя панель: Профиль, Баланс и Касса -->
  <div class="glass rounded-2xl p-3 flex justify-between items-center z-10">
    <div class="flex items-center gap-2">
      <img id="userAvatar" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100" class="w-9 h-9 rounded-full border border-cyan-500/50 object-cover">
      <div>
        <div id="userName" class="text-xs font-bold text-slate-200">Игрок</div>
        <div class="text-[10px] text-cyan-400 flex items-center gap-1"><i class="fa-solid fa-bolt text-[9px]"></i> Online</div>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <!-- Баланс -->
      <div class="glass-card px-3 py-1.5 rounded-xl flex items-center gap-1.5">
        <i class="fa-solid fa-coins text-amber-400 text-xs"></i>
        <span id="userBalance" class="text-sm font-black text-amber-300">1,000</span>
      </div>

      <!-- Кнопка Кассы -->
      <button onclick="openDepositModal()" class="bg-gradient-to-r from-cyan-500 to-blue-600 active:scale-95 transition-transform text-white text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1 glow-cyan">
        <i class="fa-solid fa-plus"></i> Касса
      </button>
    </div>
  </div>

  <!-- Лента прошлых иксов -->
  <div class="flex gap-2 overflow-x-auto no-scrollbar py-1" id="historyBar">
    <span class="glass-card text-[11px] font-extrabold px-2.5 py-1 rounded-lg text-emerald-400 border-emerald-500/20">2.45x</span>
    <span class="glass-card text-[11px] font-extrabold px-2.5 py-1 rounded-lg text-cyan-400 border-cyan-500/20">1.20x</span>
    <span class="glass-card text-[11px] font-extrabold px-2.5 py-1 rounded-lg text-rose-500 border-rose-500/20">1.05x</span>
    <span class="glass-card text-[11px] font-extrabold px-2.5 py-1 rounded-lg text-amber-400 border-amber-500/20">15.80x</span>
    <span class="glass-card text-[11px] font-extrabold px-2.5 py-1 rounded-lg text-emerald-400 border-emerald-500/20">3.10x</span>
  </div>

  <!-- Canvas Экрана Ракетки -->
  <div class="relative flex-1 rounded-2xl glass overflow-hidden flex items-center justify-center border border-cyan-500/10">
    <canvas id="gameCanvas" class="absolute inset-0 w-full h-full"></canvas>

    <!-- Оверлей Коэффициента / Статуса -->
    <div class="relative z-10 text-center pointer-events-none">
      <div id="gameStatusText" class="text-xs font-semibold tracking-widest text-cyan-400 uppercase mb-1">Ожидание ставок...</div>
      <div id="multiplierText" class="text-5xl font-black tracking-tight text-white drop-shadow-[0_0_15px_rgba(255,255,255,0.3)]">1.00x</div>
      <div id="winningsPreview" class="text-xs font-bold text-emerald-400 mt-1 opacity-0 transition-opacity">+0 монет</div>
    </div>
  </div>

  <!-- Панель Управления Ставкой -->
  <div class="glass rounded-2xl p-3 flex flex-col gap-2 z-10">
    <div class="flex items-center justify-between gap-2">
      <div class="flex-1 glass-card rounded-xl p-1.5 flex items-center justify-between px-3 border border-slate-700">
        <span class="text-[10px] uppercase font-bold text-slate-400">Ставка:</span>
        <input type="number" id="betAmount" value="100" min="10" step="10" class="bg-transparent text-right font-black text-white text-sm outline-none w-20">
      </div>
      <!-- Быстрые суммы -->
      <div class="flex gap-1">
        <button onclick="setBet(50)" class="glass-card text-xs font-bold px-2.5 py-2 rounded-xl text-slate-300 active:scale-95">+50</button>
        <button onclick="setBet(100)" class="glass-card text-xs font-bold px-2.5 py-2 rounded-xl text-slate-300 active:scale-95">+100</button>
        <button onclick="multiplyBet(2)" class="glass-card text-xs font-bold px-2.5 py-2 rounded-xl text-amber-400 active:scale-95">x2</button>
      </div>
    </div>

    <!-- Главная Кнопка Играть / Забрать -->
    <button id="mainActionButton" onclick="handleMainAction()" class="w-full py-3.5 rounded-xl font-black text-base uppercase tracking-wider text-white bg-gradient-to-r from-emerald-500 to-teal-600 active:scale-98 transition-all glow-green">
      Сделать ставку
    </button>
  </div>

  <!-- Живая лента ставок других игроков -->
  <div class="glass-card rounded-xl p-2 max-h-28 overflow-y-auto no-scrollbar text-xs">
    <div class="text-[10px] font-bold text-slate-400 uppercase mb-1.5 flex justify-between px-1">
      <span>Игрок</span><span>Ставка</span><span>Выигрыш</span>
    </div>
    <div id="liveBetsFeed" class="space-y-1">
      <!-- Генерируется динамически -->
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО КАССЫ (Stars + TON) -->
  <div id="depositModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-end sm:items-center justify-center p-3">
    <div class="glass w-full max-w-md rounded-3xl p-5 border border-cyan-500/20 flex flex-col gap-4">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-black text-white flex items-center gap-2"><i class="fa-solid fa-wallet text-cyan-400"></i> Пополнение</h3>
        <button onclick="closeDepositModal()" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <!-- Telegram Stars -->
      <div class="glass-card p-3.5 rounded-2xl border border-amber-500/20">
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-bold text-amber-300 flex items-center gap-1.5"><i class="fa-solid fa-star text-amber-400"></i> Telegram Stars</span>
          <span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-md">Быстро</span>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="buyWithStars(50, 500)" class="glass bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 p-2 rounded-xl text-center active:scale-95">
            <div class="text-xs font-black text-white">500 🪙</div>
            <div class="text-[10px] text-amber-400 font-bold">50 ⭐️</div>
          </button>
          <button onclick="buyWithStars(100, 1200)" class="glass bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 p-2 rounded-xl text-center active:scale-95">
            <div class="text-xs font-black text-white">1,200 🪙</div>
            <div class="text-[10px] text-amber-400 font-bold">100 ⭐️</div>
          </button>
          <button onclick="buyWithStars(500, 7000)" class="glass bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 p-2 rounded-xl text-center active:scale-95">
            <div class="text-xs font-black text-white">7,000 🪙</div>
            <div class="text-[10px] text-amber-400 font-bold">500 ⭐️</div>
          </button>
        </div>
      </div>

      <!-- TON Connect -->
      <div class="glass-card p-3.5 rounded-2xl border border-cyan-500/20">
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-bold text-cyan-300 flex items-center gap-1.5"><i class="fa-solid fa-gem text-cyan-400"></i> TON Crypto</span>
          <div id="tonConnectBtn"></div>
        </div>
        <div class="grid grid-cols-2 gap-2 mt-2">
          <button onclick="payWithTon(0.1, 1000)" class="glass bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/30 p-2.5 rounded-xl text-center active:scale-95">
            <div class="text-xs font-black text-white">1,000 🪙</div>
            <div class="text-[10px] text-cyan-400 font-bold">0.1 TON</div>
          </button>
          <button onclick="payWithTon(0.5, 6000)" class="glass bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/30 p-2.5 rounded-xl text-center active:scale-95">
            <div class="text-xs font-black text-white">6,000 🪙</div>
            <div class="text-[10px] text-cyan-400 font-bold">0.5 TON</div>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 1. Инициализация Telegram Web App
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.initDataUnsafe?.user) {
        document.getElementById('userName').innerText = tg.initDataUnsafe.user.first_name || 'Игрок';
        if (tg.initDataUnsafe.user.photo_url) {
          document.getElementById('userAvatar').src = tg.initDataUnsafe.user.photo_url;
        }
      }
    }

    // 2. Инициализация TON Connect
    let tonConnectUI;
    try {
      tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://kontrdef-beep.github.io/spotlight/tonconnect-manifest.json',
        buttonRootId: 'tonConnectBtn'
      });
    } catch(e) { console.log('TonConnect init error', e); }

    // 3. Состояние Игры
    let balance = parseInt(localStorage.getItem('spotlight_balance')) || 1000;
    let currentBet = 0;
    let gameState = 'WAITING'; // WAITING, FLYING, CRASHED
    let multiplier = 1.00;
    let crashPoint = 0;
    let hasCashedOut = false;
    let animationId = null;

    document.getElementById('userBalance').innerText = balance.toLocaleString();

    function updateBalance(amount) {
      balance += amount;
      localStorage.setItem('spotlight_balance', balance);
      document.getElementById('userBalance').innerText = balance.toLocaleString();
    }

    // 4. Движок Анимации Canvas
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let rocketY = 0;

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 4 + 1;
        this.speedX = (Math.random() - 0.5) * 3;
        this.speedY = Math.random() * 3 + 2;
        this.color = `hsl(${Math.random() * 40 + 170}, 100%, 50%)`;
        this.alpha = 1;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.alpha -= 0.03;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function renderFrame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Фон: Сетка и Звезды
      ctx.strokeStyle = 'rgba(6, 182, 212, 0.05)';
      ctx.lineWidth = 1;
      const step = 30;
      for (let x = 0; x < canvas.width; x += step) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }

      if (gameState === 'FLYING') {
        const progress = Math.min((multiplier - 1) / 5, 1);
        const rocketX = canvas.width * 0.2 + (canvas.width * 0.5 * progress);
        rocketY = canvas.height * 0.8 - (canvas.height * 0.5 * progress);

        // Частицы огня
        for (let i = 0; i < 3; i++) particles.push(new Particle(rocketX - 10, rocketY + 10));

        // Отрисовка траектории
        ctx.beginPath();
        ctx.strokeStyle = '#06b6d4';
        ctx.lineWidth = 3;
        ctx.moveTo(canvas.width * 0.1, canvas.height * 0.85);
        ctx.quadraticCurveTo(rocketX * 0.5, canvas.height * 0.85, rocketX, rocketY);
        ctx.stroke();

        // Отрисовка Ракетки
        ctx.save();
        ctx.translate(rocketX, rocketY);
        ctx.rotate(-Math.PI / 6);
        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.ellipse(0, 0, 15, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#06b6d4';
        ctx.beginPath();
        ctx.arc(4, 0, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Обновление частиц
      particles.forEach((p, index) => {
        p.update();
        p.draw();
        if (p.alpha <= 0) particles.splice(index, 1);
      });

      if (gameState === 'FLYING' || gameState === 'WAITING') {
        animationId = requestAnimationFrame(renderFrame);
      }
    }

    // 5. Игровая Логика
    function startNextRound() {
      gameState = 'WAITING';
      multiplier = 1.00;
      hasCashedOut = false;
      document.getElementById('multiplierText').innerText = '1.00x';
      document.getElementById('multiplierText').className = 'text-5xl font-black text-white';
      document.getElementById('gameStatusText').innerText = 'Ожидание ставок (3 сек)...';
      document.getElementById('winningsPreview').classList.add('opacity-0');
      
      const btn = document.getElementById('mainActionButton');
      btn.innerText = 'Сделать ставку';
      btn.className = 'w-full py-3.5 rounded-xl font-black text-base uppercase text-white bg-gradient-to-r from-emerald-500 to-teal-600 active:scale-98 glow-green';

      setTimeout(launchRocket, 3000);
      renderFrame();
    }

    function launchRocket() {
      gameState = 'FLYING';
      crashPoint = (Math.random() < 0.3) ? 1.05 + Math.random() * 0.5 : 1.5 + Math.random() * 8; // Генерация икса
      document.getElementById('gameStatusText').innerText = 'Ракетка летит!';

      if (currentBet > 0 && !hasCashedOut) {
        const btn = document.getElementById('mainActionButton');
        btn.innerText = 'ЗАБРАТЬ!';
        btn.className = 'w-full py-3.5 rounded-xl font-black text-base uppercase text-white bg-gradient-to-r from-amber-500 to-orange-600 active:scale-98 glow-amber';
      }

      const startTime = Date.now();
      const interval = setInterval(() => {
        if (gameState !== 'FLYING') { clearInterval(interval); return; }

        const elapsed = (Date.now() - startTime) / 1000;
        multiplier = Math.pow(1.18, elapsed * 3);
        document.getElementById('multiplierText').innerText = multiplier.toFixed(2) + 'x';

        if (currentBet > 0 && !hasCashedOut) {
          const win = Math.floor(currentBet * multiplier);
          const winEl = document.getElementById('winningsPreview');
          winEl.innerText = `+${win} монет`;
          winEl.classList.remove('opacity-0');
        }

        if (multiplier >= crashPoint) {
          clearInterval(interval);
          triggerCrash();
        }
      }, 50);
    }

    function triggerCrash() {
      gameState = 'CRASHED';
      tg?.HapticFeedback?.notificationOccurred('error');
      document.getElementById('gameStatusText').innerText = 'РАКЕТКА ВЗОРВАЛАСЬ!';
      document.getElementById('multiplierText').innerText = multiplier.toFixed(2) + 'x';
      document.getElementById('multiplierText').className = 'text-5xl font-black text-rose-500 drop-shadow-[0_0_20px_rgba(244,63,94,0.6)]';

      // Взрыв - очистка
      ctx.fillStyle = 'rgba(244, 63, 94, 0.3)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      addHistoryBadge(multiplier.toFixed(2));
      currentBet = 0;
      setTimeout(startNextRound, 3000);
    }

    function handleMainAction() {
      if (gameState === 'WAITING' && currentBet === 0) {
        const amount = parseInt(document.getElementById('betAmount').value);
        if (amount > balance) return alert('Недостаточно монет!');
        
        currentBet = amount;
        updateBalance(-currentBet);
        tg?.HapticFeedback?.impactOccurred('medium');

        const btn = document.getElementById('mainActionButton');
        btn.innerText = 'Ставка принята ✓';
        btn.className = 'w-full py-3.5 rounded-xl font-black text-base uppercase text-slate-300 bg-slate-800 cursor-not-allowed';
      } else if (gameState === 'FLYING' && currentBet > 0 && !hasCashedOut) {
        hasCashedOut = true;
        const winnings = Math.floor(currentBet * multiplier);
        updateBalance(winnings);
        tg?.HapticFeedback?.notificationOccurred('success');

        const btn = document.getElementById('mainActionButton');
        btn.innerText = `Забрано +${winnings}!`;
        btn.className = 'w-full py-3.5 rounded-xl font-black text-base uppercase text-white bg-emerald-600 glow-green';
      }
    }

    // 6. Касса: Пополнение
    function openDepositModal() { document.getElementById('depositModal').classList.remove('hidden'); }
    function closeDepositModal() { document.getElementById('depositModal').classList.add('hidden'); }

    function buyWithStars(starsAmount, coinsAmount) {
      tg?.HapticFeedback?.impactOccurred('rigid');
      // Симуляция успешного платежа через Telegram Stars Invoice
      if (tg?.openInvoice) {
        // Здесь подключается реальный invoiceLink от твоего бот-бэкенда
        alert(`Запрос инвойса Telegram Stars на ${starsAmount} ⭐️`);
      }
      // Демо начисление
      updateBalance(coinsAmount);
      alert(`Успешно получено ${coinsAmount} монет!`);
      closeDepositModal();
    }

    async function payWithTon(tonAmount, coinsAmount) {
      if (!tonConnectUI?.connected) {
        return alert('Сначала подключите TON-кошелек!');
      }
      const transaction = {
        validUntil: Math.floor(Date.now() / 1000) + 300,
        messages: [{ address: "EQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAM9c", amount: (tonAmount * 1000000000).toString() }]
      };
      try {
        await tonConnectUI.sendTransaction(transaction);
        updateBalance(coinsAmount);
        alert(`Депозит принят! Зачислено ${coinsAmount} монет.`);
        closeDepositModal();
      } catch(e) { alert('Транзакция отменена'); }
    }

    // Вспомогательные функции UI
    function setBet(val) { document.getElementById('betAmount').value = val; }
    function multiplyBet(factor) { 
      const input = document.getElementById('betAmount');
      input.value = parseInt(input.value) * factor;
    }

    function addHistoryBadge(mult) {
      const bar = document.getElementById('historyBar');
      const badge = document.createElement('span');
      const color = mult >= 2 ? 'text-emerald-400 border-emerald-500/20' : 'text-rose-500 border-rose-500/20';
      badge.className = `glass-card text-[11px] font-extrabold px-2.5 py-1 rounded-lg ${color}`;
      badge.innerText = mult + 'x';
      bar.prepend(badge);
    }

    // Симуляция живых ставок бота
    setInterval(() => {
      const feed = document.getElementById('liveBetsFeed');
      const names = ['Alex', 'Dmitry', 'Sasha', 'CryptoKing', 'Elena', 'Ivan'];
      const randomName = names[Math.floor(Math.random() * names.length)];
      const randomBet = (Math.floor(Math.random() * 20) + 1) * 50;
      const randomX = (1.1 + Math.random() * 4).toFixed(2);

      const row = document.createElement('div');
      row.className = 'flex justify-between items-center text-slate-300 border-b border-slate-800/50 pb-1';
      row.innerHTML = `<span>${randomName}</span><span>${randomBet} 🪙</span><span class="text-emerald-400 font-bold">+${Math.floor(randomBet * randomX)} (${randomX}x)</span>`;
      feed.prepend(row);
      if (feed.children.length > 5) feed.lastChild.remove();
    }, 2500);

    // Запуск игры
    startNextRound();
  </script>
</body>
</html>
