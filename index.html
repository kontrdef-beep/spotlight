<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spotlight — Знакомства Москвы</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #1e293b;
      --accent-like: #10b981;
      --accent-dislike: #f43f5e;
      --primary: #6366f1;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { background-color: var(--bg); color: var(--text); overflow: hidden; height: 100vh; width: 100vw; }

    #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; }

    /* Табы */
    .tab-content { flex: 1; display: none; position: relative; width: 100%; height: calc(100vh - 65px); }
    .tab-content.active { display: block; }

    /* Карта */
    #map { width: 100%; height: 100%; z-index: 1; }
    
    .leaflet-popup-content-wrapper { background: var(--card-bg); color: var(--text); border-radius: 16px; padding: 5px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
    .leaflet-popup-tip { background: var(--card-bg); }
    .map-popup-card { text-align: center; padding: 10px; width: 180px; }
    .map-popup-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 10px; margin-bottom: 8px; }
    .map-popup-card h4 { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
    .map-popup-card p { font-size: 12px; color: var(--text-muted); }

    /* Свайпы */
    .swipe-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 15px; background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 70%); }
    .card-deck { position: relative; width: 100%; max-width: 380px; height: 70vh; }
    .card { position: absolute; width: 100%; height: 100%; background: var(--card-bg); border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; box-shadow: 0 20px 30px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); touch-action: none; transition: transform 0.1s ease-out; }
    .card-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .card-gradient { position: absolute; bottom: 0; left: 0; right: 0; height: 60%; background: linear-gradient(to top, rgba(11,15,25,0.95) 10%, rgba(11,15,25,0.4) 60%, transparent); pointer-events: none; }
    .card-info { position: relative; z-index: 3; pointer-events: none; }
    .card-name { font-size: 26px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .card-badge { font-size: 12px; padding: 2px 8px; background: rgba(99,102,241,0.3); border: 1px solid var(--primary); border-radius: 12px; color: #a5b4fc; }
    .card-bio { font-size: 14px; color: var(--text-muted); margin-top: 6px; line-height: 1.4; }

    .swipe-actions { display: flex; gap: 30px; margin-top: 20px; z-index: 10; }
    .btn-action { width: 65px; height: 65px; border-radius: 50%; border: none; font-size: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; box-shadow: 0 10px 20px rgba(0,0,0,0.4); transition: transform 0.2s; }
    .btn-dislike { background: var(--accent-dislike); }
    .btn-like { background: var(--accent-like); }
    .btn-action:active { transform: scale(0.85); }

    /* Профиль и Формы */
    .form-container { padding: 25px; overflow-y: auto; height: 100%; background: var(--bg); }
    .form-title { font-size: 22px; font-weight: 700; margin-bottom: 20px; color: var(--text); }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-control { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: #1e293b; color: #fff; font-size: 15px; outline: none; transition: border-color 0.2s; }
    .form-control:focus { border-color: var(--primary); }
    .btn-primary { width: 100%; padding: 16px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border: none; border-radius: 14px; color: white; font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: 0 8px 20px rgba(99,102,241,0.3); }

    /* Навигация */
    .nav-bar { height: 65px; background: rgba(15, 23, 42, 0.95); border-top: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-around; align-items: center; backdrop-filter: blur(12px); z-index: 1000; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 10px; font-weight: 600; cursor: pointer; transition: color 0.2s; }
    .nav-item i { font-size: 22px; }
    .nav-item.active { color: #38bdf8; }

    /* Админка */
    .admin-list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
    .btn-del { background: #ef4444; border: none; color: white; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

<div id="app">
  <!-- Вкладка 1: Карта -->
  <div id="tab-map" class="tab-content active">
    <div id="map"></div>
  </div>

  <!-- Вкладка 2: Свайпы -->
  <div id="tab-swipe" class="tab-content">
    <div class="swipe-container">
      <div class="card-deck" id="cardDeck"></div>
      <div class="swipe-actions">
        <button class="btn-action btn-dislike" onclick="triggerSwipe(false)"><i class="fas fa-times"></i></button>
        <button class="btn-action btn-like" onclick="triggerSwipe(true)"><i class="fas fa-heart"></i></button>
      </div>
    </div>
  </div>

  <!-- Вкладка 3: Мой Профиль -->
  <div id="tab-profile" class="tab-content">
    <div class="form-container">
      <div class="form-title">Редактировать Анкету</div>
      <div class="form-group">
        <label>Ваше Имя</label>
        <input type="text" id="profName" class="form-control" placeholder="Например: Саша">
      </div>
      <div class="form-group">
        <label>Возраст</label>
        <input type="number" id="profAge" class="form-control" placeholder="20">
      </div>
      <div class="form-group">
        <label>Вуз / Занятие</label>
        <input type="text" id="profTag" class="form-control" placeholder="МГУ им. Ломоносова">
      </div>
      <div class="form-group">
        <label>О себе</label>
        <textarea id="profBio" class="form-control" rows="3" placeholder="Учусь на ВМК, вечер проводим в парке..."></textarea>
      </div>
      <div class="form-group">
        <label>Ссылка на фото профиля (URL)</label>
        <input type="text" id="profPhoto" class="form-control" placeholder="https://images.unsplash.com/...">
      </div>
      <button class="btn-primary" onclick="saveUserProfile()">Опубликовать анкету</button>
    </div>
  </div>

  <!-- Вкладка 4: Настройки & Админка -->
  <div id="tab-settings" class="tab-content">
    <div class="form-container">
      <div class="form-title">Настройки</div>
      <div class="form-group">
        <label>Радиус поиска анкет (км)</label>
        <input type="number" class="form-control" value="10">
      </div>
      
      <hr style="border-color: rgba(255,255,255,0.1); margin: 25px 0;">
      
      <div class="form-title" style="color: #ef4444; font-size: 18px;">Администрирование</div>
      <div class="form-group">
        <label>PIN-код Администратора</label>
        <input type="password" id="adminPin" class="form-control" placeholder="Введите код">
      </div>
      <button class="btn-primary" style="background: #334155; box-shadow: none;" onclick="loginAdmin()">Войти в панель</button>
      
      <div id="adminPanel" style="display: none; margin-top: 25px; background: #1e293b; padding: 15px; border-radius: 14px;">
        <h4 style="color: #ef4444; margin-bottom: 12px;">Активные анкеты системы</h4>
        <div id="adminUsersList"></div>
      </div>
    </div>
  </div>

  <!-- Нижняя Панель Навигации -->
  <nav class="nav-bar">
    <div class="nav-item active" onclick="switchTab('map', this)"><i class="fas fa-map-marked-alt"></i><span>Карта</span></div>
    <div class="nav-item" onclick="switchTab('swipe', this)"><i class="fas fa-fire"></i><span>Анкеты</span></div>
    <div class="nav-item" onclick="switchTab('profile', this)"><i class="fas fa-user"></i><span>Профиль</span></div>
    <div class="nav-item" onclick="switchTab('settings', this)"><i class="fas fa-cog"></i><span>Настройки</span></div>
  </nav>
</div>

<script>
  // Инициализация Telegram WebApp
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  // 1. Инициализация карты CartoDB Voyager
  const map = L.map('map', { zoomControl: false }).setView([55.7558, 37.6173], 12);
  
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    maxZoom: 20,
    subdomains: 'abcd',
    attribution: '© CARTO'
  }).addTo(map);

  // Геолокация
  let userLocation = [55.7558, 37.6173];
  map.locate({setView: true, maxZoom: 14});
  
  let userMarker;
  map.on('locationfound', function(e) {
    userLocation = [e.latlng.lat, e.latlng.lng];
    if (!userMarker) {
      userMarker = L.circleMarker(e.latlng, { radius: 10, fillColor: '#38bdf8', color: '#fff', weight: 3, fillOpacity: 1 }).addTo(map);
      userMarker.bindPopup("<b>Вы здесь</b>");
    } else {
      userMarker.setLatLng(e.latlng);
    }
  });

  // База анкет
  let profiles = JSON.parse(localStorage.getItem('spotlight_profiles')) || [
    { id: 1, name: "Катя", age: 20, tag: "ВШЭ", bio: "Ищу компанию для прогулок по Покровке и кофе ☕", photo: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500", lat: 55.7580, lng: 37.6400 },
    { id: 2, name: "Артем", age: 22, bio: "Пишу код на Python, катаюсь на скейте в Парке Горького 🛹", tag: "МГТУ Баумана", photo: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=500", lat: 55.7660, lng: 37.6830 },
    { id: 3, name: "Даша", age: 19, bio: "Учусь на журфаке МГУ, люблю выставки в ГЭС-2 🎨", tag: "МГУ", photo: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500", lat: 55.7480, lng: 37.6110 }
  ];

  let mapMarkers = [];
  function updateMapMarkers() {
    mapMarkers.forEach(m => map.removeLayer(m));
    mapMarkers = [];
    profiles.forEach(p => {
      const m = L.marker([p.lat, p.lng]).addTo(map);
      m.bindPopup(`
        <div class="map-popup-card">
          <img src="${p.photo}">
          <h4>${p.name}, ${p.age}</h4>
          <p>${p.tag || ''}</p>
        </div>
      `);
      mapMarkers.push(m);
    });
  }
  updateMapMarkers();

  // 2. Механика Свайпов
  let currentCardIndex = 0;
  function renderCardDeck() {
    const deck = document.getElementById('cardDeck');
    deck.innerHTML = '';
    
    if (currentCardIndex >= profiles.length) {
      deck.innerHTML = `<div style="text-align:center; padding-top:40%; color:var(--text-muted); font-weight:600;">Анкеты поблизости закончились!<br><br>Попробуйте зайти позже.</div>`;
      return;
    }

    const p = profiles[currentCardIndex];
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'activeCard';
    card.innerHTML = `
      <img class="card-img" src="${p.photo}">
      <div class="card-gradient"></div>
      <div class="card-info">
        <div class="card-name">${p.name}, ${p.age} <span class="card-badge">${p.tag || 'Москва'}</span></div>
        <div class="card-bio">${p.bio}</div>
      </div>
    `;
    deck.appendChild(card);
    setupDrag(card);
  }

  function triggerSwipe(isLike) {
    const card = document.getElementById('activeCard');
    if (!card) return;
    card.style.transition = 'transform 0.4s ease, opacity 0.4s ease';
    card.style.transform = `translate(${isLike ? 500 : -500}px, 0px) rotate(${isLike ? 30 : -30}deg)`;
    card.style.opacity = '0';
    setTimeout(() => {
      currentCardIndex++;
      renderCardDeck();
    }, 300);
  }

  function setupDrag(el) {
    let startX = 0, currentX = 0;
    const onStart = (e) => { startX = e.touches ? e.touches[0].clientX : e.clientX; };
    const onMove = (e) => {
      if (!startX) return;
      currentX = (e.touches ? e.touches[0].clientX : e.clientX) - startX;
      el.style.transform = `translate(${currentX}px, 0px) rotate(${currentX * 0.08}deg)`;
    };
    const onEnd = () => {
      if (Math.abs(currentX) > 100) {
        triggerSwipe(currentX > 0);
      } else {
        el.style.transform = 'translate(0, 0) rotate(0)';
      }
      startX = 0; currentX = 0;
    };
    el.addEventListener('touchstart', onStart);
    el.addEventListener('touchmove', onMove);
    el.addEventListener('touchend', onEnd);
    el.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);
  }

  renderCardDeck();

  // 3. Сохранение профиля
  function saveUserProfile() {
    const name = document.getElementById('profName').value;
    const age = document.getElementById('profAge').value;
    const tag = document.getElementById('profTag').value;
    const bio = document.getElementById('profBio').value;
    const photo = document.getElementById('profPhoto').value;

    if (!name || !age) return alert('Укажите имя и возраст!');

    const newProfile = {
      id: Date.now(),
      name: name,
      age: parseInt(age),
      tag: tag || 'Студент',
      bio: bio || 'Описание отсутствует',
      photo: photo || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=500',
      lat: userLocation[0] + (Math.random() - 0.5) * 0.01,
      lng: userLocation[1] + (Math.random() - 0.5) * 0.01
    };

    profiles.unshift(newProfile);
    localStorage.setItem('spotlight_profiles', JSON.stringify(profiles));
    updateMapMarkers();
    currentCardIndex = 0;
    renderCardDeck();
    alert('Ваша анкета опубликована на карте Москвы!');
  }

  // 4. Переключение табов
  function switchTab(tabName, el) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById(`tab-${tabName}`).classList.add('active');
    el.classList.add('active');
    if (tabName === 'map') setTimeout(() => map.invalidateSize(), 200);
  }

  // 5. Админка
  function loginAdmin() {
    const pin = document.getElementById('adminPin').value;
    if (pin === '1337') {
      document.getElementById('adminPanel').style.display = 'block';
      renderAdminList();
    } else {
      alert('Неверный PIN-код!');
    }
  }

  function renderAdminList() {
    const container = document.getElementById('adminUsersList');
    container.innerHTML = profiles.map(p => `
      <div class="admin-list-item">
        <span><b>${p.name}</b> (${p.age}) — ${p.tag || ''}</span>
        <button class="btn-del" onclick="deleteProfile(${p.id})">Удалить</button>
      </div>
    `).join('');
  }

  function deleteProfile(id) {
    profiles = profiles.filter(p => p.id !== id);
    localStorage.setItem('spotlight_profiles', JSON.stringify(profiles));
    updateMapMarkers();
    renderCardDeck();
    renderAdminList();
  }
</script>
</body>
</html>
